<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Pagamento — Prima Linea</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="css/simulador.css" rel="stylesheet">

  <!-- Bibliotecas externas: html2canvas (exportar PNG) e Firebase (configuração do portal admin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>

  <script src="js/config.js" defer></script>
  <script src="js/calc.js" defer></script>
  <script src="js/simulacao.js" defer></script>
  <script src="js/simulador.js" defer></script>
</head>
<body>

<header class="header">
  <div class="header-logo">Prima Linea</div>
  <div class="header-sub">Simulador de Condições de Pagamento</div>
  <a class="header-link" href="admin.html">Portal Administrativo</a>
</header>

<main class="container">
  <section class="input-panel">
    <div class="input-panel-top">
      <div class="field-group">
        <label class="field-label" for="valor">Valor do Orçamento / Valor de <u>Tabela</u></label>
        <div class="valor-wrapper">
          <span class="valor-prefix">R$</span>
          <input class="valor-input" type="text" id="valor" placeholder="0,00" inputmode="numeric" autocomplete="off">
        </div>
      </div>

      <div class="field-group" id="entrada-group">
        <label class="field-label" for="dataEntrada">Data da Entrada *</label>
        <div class="date-wrapper">
          <input class="date-input" type="text" id="dataEntrada" placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" autocomplete="off">
          <span class="date-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <input class="date-native" type="date" tabindex="-1" aria-label="Abrir calendário">
        </div>
        <span class="field-error" id="entrada-error"></span>
      </div>

      <div class="field-group">
        <label class="field-label" for="dataParcela">Data da 1ª Parcela *</label>
        <div class="date-wrapper">
          <input class="date-input" type="text" id="dataParcela" placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" autocomplete="off">
          <span class="date-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <input class="date-native" type="date" tabindex="-1" aria-label="Abrir calendário">
        </div>
        <span class="field-error" id="parcela-error"></span>
      </div>
    </div>

    <!-- Modalidade do financiamento Santander:
         Com entrada     → cliente paga a entrada na loja e o restante via Santander (30d)
         Sem entrada 30d → todas as parcelas via Santander, recebimento em 30 dias
         Sem entrada 60d → todas as parcelas via Santander, recebimento em 60 dias -->
    <div class="seg-control" role="radiogroup" aria-label="Modalidade">
      <input type="radio" name="modo" id="modo-com" value="com" checked>
      <label for="modo-com">Com entrada</label>
      <input type="radio" name="modo" id="modo-sem30" value="sem30">
      <label for="modo-sem30">Sem entrada · 30d</label>
      <input type="radio" name="modo" id="modo-sem60" value="sem60">
      <label for="modo-sem60">Sem entrada · 60d</label>
    </div>
  </section>

  <!-- Preenchido por js/simulador.js -->
  <div id="resultado"></div>
</main>

<div id="print-frame"></div>
<div class="loading" id="loading" hidden><div class="loading-box">Gerando imagem...</div></div>

<template id="placeholder-template">
  <div class="placeholder">
    <span class="placeholder-icon">✦</span>
    <p>Digite o valor do orçamento para simular<br>as condições de pagamento.</p>
  </div>
</template>

</body>
</html>
